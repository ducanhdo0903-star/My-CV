<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trang web đầu tiên của Đỗ Đức Anh">
  <title>Trang web đầu tiên - Đỗ Đức Anh</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#172033;background:linear-gradient(135deg,#e0f2fe,#eef2ff 55%,#f5eaff)}
    main{width:min(760px,100%);padding:clamp(32px,7vw,72px);text-align:center;background:#fff;border:1px solid #e5eaf3;border-radius:28px;box-shadow:0 24px 70px rgba(35,55,90,.12)}
    .tag{display:inline-block;padding:9px 16px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:26px 0 16px;font-size:clamp(34px,7vw,58px);line-height:1.1;letter-spacing:-.04em}
    p{margin:0 auto;color:#64748b;font-size:18px;line-height:1.7;max-width:520px}
    .name{color:#2563eb}.mark{width:64px;height:64px;margin:30px auto 0;display:grid;place-items:center;border-radius:20px;background:#2563eb;color:white;font-size:28px;font-weight:800}
    footer{margin-top:34px;color:#94a3b8;font-size:13px}
  </style>
</head>
<body>
  <main>
    <span class="tag">Website đầu tiên</span>
    <h1>Đây là trang web đầu tiên của <span class="name">Đỗ Đức Anh</span></h1>
    <p>Chào mừng bạn đến với trang web đầu tiên của tôi. Đây là bước khởi đầu trong hành trình học tập và khám phá thế giới thiết kế, công nghệ và lập trình web.</p>
    <div class="mark" aria-hidden="true">A</div>
    <footer>© 2026 Đỗ Đức Anh · Được xây dựng bằng HTML &amp; CSS</footer>
  </main>
</body>
</html>
